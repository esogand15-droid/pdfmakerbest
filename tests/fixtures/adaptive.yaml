  - id: fa-lp1
    type: paragraph
    status: needs_review
    sources:
    - book: سند آزمون
      pages: ۱
    text: این پاراگراف آزمایشیِ بلند برای ساختن یک بخش کاملاً توضیحی نوشته شده است؛
      متنی آرام و پیوسته که نه شکل دارد، نه جدول و نه نمودار، و تنها هدفش این است
      که موتور آن را به‌عنوان یک بخش توضیحی بشناسد و ریتم صفحه را بر همان اساس انتخاب
      کند. در چنین بخشی خواننده باید بدون پرش بصری، خط استدلال را دنبال کند و صفحه
      نباید با کادرهای رنگی بی‌دلیل شلوغ شود. این جمله‌ها صرفاً برای آزمون‌اند و هیچ
      ادعای علمی ندارند؛ فقط حجم و پیوستگی متن را می‌سازند تا رفتار تحلیل‌گر و امتیازدهی
      چیدمان در برابر یک بخش متنی واقعی سنجیده شود و نتیجه قابل تکرار باشد.
