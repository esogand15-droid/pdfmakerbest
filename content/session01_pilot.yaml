      - id: s01t6-p1
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۴" }]
        text: >-
          نوروگلیاها سلول‌هایی هستند که فعالیت حیاتی و درونی نورون‌ها را حمایت می‌کنند. از نظر تعداد،
          در پستانداران تعدادشان [[num:ده برابر]] نورون‌هاست؛ از نظر اندازه از نورون‌ها کوچک‌ترند و منشأشان
          همانند سلول‌های عصبی اکثراً از صفحهٔ عصبی اکتودرم است. در دستگاه عصبی مرکزی ([en:CNS]) بافت
          همبند وجود ندارد — جز در اطراف عروق بزرگی که وارد [en:CNS] می‌شوند.
      - id: s01t6-p2
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۴" }]
        text: >-
          زوائدی از نوروگلیا در بخش‌هایی با زوائد نورون‌ها در ارتباطند؛ به مجموع زوائد متصل‌به‌هم
          نوروگلیاها و نورون‌ها **نوروپیل** گفته می‌شود. نوروپیل در بافت [en:CNS] نقش کلاژن و بافت
          پیوندی را بازی می‌کند و چون بافت پیوندی در تغذیه هم نقش دارد، نوروپیل نقش حمایت تغذیه‌ای هم دارد.
