      - id: s01t4-s1
        type: section
        title: "آکسون و منشأ آن: تپهٔ آکسونی و قطعهٔ اولیه"
        text: "آکسون‌ها رشته‌های بلندی هستند که معمولاً فقط **یک عدد** از هر نورون خارج می‌شود و از نظر ظاهری استوانه‌ای و نخ‌مانندند."
      - id: s01t4-p1
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۷" }]
        text: >-
          آکسون‌ها رشته‌های بلندی هستند که معمولاً فقط **یک عدد** از هر نورون خارج می‌شود و از نظر
          ظاهری استوانه‌ای و نخ‌مانندند. برخلاف دندریت‌ها که از همان ابتدا شاخه‌شاخه می‌شوند، آکسون
          معمولاً یک مسیر طولانی را یکپارچه طی می‌کند و تازه در انتهای مسیرش شروع به شاخه‌شاخه شدن می‌کند.
      - id: s01t4-p2
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۷" }]
        text: >-
          آکسون از یک ناحیهٔ مخروطی‌شکل روی جسم سلولی به نام [[term:تپهٔ آکسونی|Axon Hillock]]
          منشأ می‌گیرد. دقیقاً بعد از تپهٔ آکسونی، منطقهٔ بسیار مهمی به نام
          [[term:قطعهٔ اولیه|Initial Segment]] قرار دارد که نقش جمع جبری ([en:Summation]) را بر عهده
          دارد: تمام اطلاعات، تحریکات و پیام‌های مهاری که به نورون رسیده در این نقطه بررسی و جمع‌بندی
          می‌شود و همان‌جاست که نورون تصمیم می‌گیرد پتانسیل عمل ایجاد شود یا پیام متوقف و مهار شود.
          دلیل این توانایی، تراکم بسیار بالای کانال‌های یونی — مخصوصاً کانال‌های سدیمی ولتاژی — در این
          ناحیه است.
      - id: s01t4-p3
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۷" }, { book: اسنل, pages: "۱۲۰" }]
        text: >-
          یک تفاوت بسیار مهم آکسون با دندریت در قطر آن است: قطر دندریت با نزدیک شدن به انتها کم می‌شود،
          اما قطر آکسون در تمام طول مسیرش از ابتدا تا انتها کاملاً یکسان و ثابت است.
