        status: unresolved_conflict
        title: یک اختلاف عددی که باید ثبت شود، نه اصلاح
        text: >-
          متن جزوه عدد انتقال سریع را «بیش از [[num:۴۰۰ میلی‌متر در روز]]» می‌دهد. اسنل در صفحهٔ ۱۰۸ انتقال
          سریع را «[[num:۱۰۰ تا ۴۰۰ میلی‌متر در روز]]» می‌نویسد و همان دو موتور پروتئینی (کینزین برای آنتروگراد
          و داینین برای رتروگراد) را نام می‌برد. هر دو نقل شده‌اند و کنار هم مانده‌اند تا در بازبینی
          نهایی مشخص شود کدام در متن نهایی می‌ماند.
        sources: [{ book: جزوهٔ درس, pages: "۹" }, { book: "اسنل، فصل ۲", pages: "۱۰۸" }]
      - id: s01t4-c2
        type: callout
        kind: clinical
        status: needs_review
        title: "مسیر رتروگراد، در ورود بعضی ویروس‌ها"
        text: >-
          بسیاری از ویروس‌ها مانند ویروس هاری و پولیو از همین مسیر رتروگراد استفاده می‌کنند تا خودشان
          را به جسم سلولی برسانند و سیستم عصبی را درگیر کنند. این جمله در جزوه با عنوان «نکتهٔ بالینی»
          آمده و همان است که اهمیت بالینی انتقال آکسونی را نشان می‌دهد: هر دارو یا ویروسی که بخواهد از
          محیط به جسم سلولی برسد، در عمل با داینین هم‌مسیر می‌شود.
        sources: [{ book: جزوهٔ درس, pages: "۹" }]

