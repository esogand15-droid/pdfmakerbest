          الکترونی که جزئیات را و تصاویرش سیاه‌وسفید است. در این تصویر هسته کاملاً مشخص است و
          غشای آن ساختار دو لایهٔ فسفولیپیدی دارد؛ بیرون از هسته، سیتوپلاسم پر از اندامک است؛
          میتوکندری‌ها با شکل و اندازه‌های مختلف پخش شده‌اند؛ دستگاه گلژی و شبکهٔ آندوپلاسمی خشن
          با ریبوزوم‌های چسبیده به‌شکل نقطه‌های سیاه دیده می‌شود؛ و ساختار کاملاً سیاه و متراکم،
