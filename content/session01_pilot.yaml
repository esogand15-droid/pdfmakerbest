    blocks:
      - id: s01t5-s1
        type: section
        title: "طبقه‌بندی عملکردی: نورون چه کاری می‌کند"
      - id: s01t5-p1
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۰" }]
        text: >-
          **نورون‌های حسی یا [[term:آوران|Afferent]]** ([en:Sensory / Afferent Neurons]): اطلاعات
          حسی مانند لمس، درد و دما را از محیط می‌گیرند و به سیستم عصبی مرکزی می‌آورند (آوران =
          آورنده). **نورون‌های حرکتی یا [[term:وابران|Efferent]]**
          ([en:Motor / Efferent Neurons]): دستورات را از مغز و نخاع می‌گیرند و به اندام‌های هدف
          (عضلات یا غدد) می‌برند (وابران = بیرون‌برنده). **نورون‌های [[term:بینابینی|Interneurons]]
          یا حد واسط**: کاملاً درون [en:CNS] قرار دارند و بین نورون‌های حسی و حرکتی ارتباط برقرار
          می‌کنند؛ اطلاعات حسی را تحلیل می‌کنند و تصمیم می‌گیرند چه دستور حرکتی صادر شود.
      - id: s01t5-p2
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۰" }]
        text: >-
          نورون‌های حرکتی (وابران) که پیام را به عضلات و غدد می‌برند، دو مدل حرکت ایجاد می‌کنند:
          [[term:سوماتیک|Somatic]] که ارادی است، مانند تکان دادن دست؛ و
          [[term:اتونومیک|Autonomic]] که غیرارادی است، مانند ضربان قلب یا حرکات روده. همین جمله،
          در ورود به جلسهٔ ۱۲ (دستگاه عصبی خودکار) است.
      - id: s01t5-s2
        type: section
        title: "طبقه‌بندی مورفولوژیک: نورون چه شکلی است"
      - id: s01t5-p3
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۰" }]
        text: >-
          ملاک این تقسیم‌بندی فقط و فقط تعداد خروجی‌های مستقیم از خود جسم سلولی است؛ کاری نداریم که
          آن زائده دو سانتی‌متر جلوتر به صد شاخه تقسیم شود یا نه. بر این اساس چهار مدل نورون داریم
          که شکل ۲-۳ اسنل هم همان‌ها را رسم کرده است.
