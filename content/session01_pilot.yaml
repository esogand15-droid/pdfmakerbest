        sources: [{ book: "اسنل، فصل ۲", figure: "۲-۱", pages: "۹۱" }]
      - id: s01t2-s2
        type: section
        title: "جسم سلولی: مرکز سازمان‌دهی سلول"
      - id: s01t2-p3
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۳" }]
        text: >-
          جسم سلولی مرکز سازمان‌دهی سلول است و وظیفه‌اش تأمین تمام نیازهای سلول است. برای این کار
          به هسته، هستک و اندامک‌ها نیاز دارد. در جسم سلولی، هسته را می‌بینیم که سیتوپلاسم
          احاطه‌اش کرده و این سیتوپلاسم پر از اندامک‌های مختلف است؛ ترکیب هسته و سیتوپلاسم اطرافش
          باعث می‌شود پریکاریون ظاهری حجیم پیدا کند و زیر میکروسکوپ متورم و برجسته دیده شود.
      - id: s01t2-p4
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۳" }, { book: "اسنل، جدول ۲-۲", pages: "۹۹" }]
        text: >-
          هستهٔ پریکاریون دو ویژگی مهم دارد: گرد و [[term:یوکروماتین|Euchromatin]] است، یعنی
          کروماتین‌هایش باز و روشن‌اند؛ و هستک واضحی دارد. این دو ویژگی می‌گویند این هسته به‌شدت
          فعال است و با سرعت بالا رونویسی می‌کند تا سیتوپلاسم با پروتئین‌سازی مواد مورد نیاز نورون
          را بسازد. اسنل هم در جدول ساختارهای جسم سلولی همین را با واژه‌های «هستهٔ بزرگ و گرد،
          کروماتین پراکندهٔ روشن و یک هستک برجسته» توصیف می‌کند.
      - id: s01t2-p5
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۴" }, { book: "اسنل، فصل ۲", pages: "۱۰۵" }]
        text: >-
          در سیتوپلاسم اندامک‌های مختلفی هست، اما مهم‌ترینشان شبکهٔ آندوپلاسمی خشن است که قشنگ
          توسعه یافته؛ دقیقاً در کنار این شبکه، پلی‌ریبوزوم‌ها هم قرار دارند. قرار گرفتن این دو
          کنار هم نشان می‌دهد سلول در تولید پروتئین فعال است. از نظر بافت‌شناسی، ترکیب شبکهٔ خشن و
          ریبوزوم‌ها ساختاری بازوفیل (رنگ‌پذیر با رنگ‌های بازی) در سیتوپلاسم می‌سازد که به آن
          [[term:اجسام نیسل|Nissl bodies]] می‌گویند و نام دیگرش مادهٔ کروماتوفیل است؛ چون به
          صورت دسته‌های بسیار زیاد در پریکاریون پخش شده و به‌شدت رنگ‌پذیر است.
      - id: s01t2-f3
        type: figure
        status: needs_review
        file: assets/figures/session01/p14_x72.png
        layout: auto
        title_fa: "محتویات پریکاریون روی یک برش شماتیک"
        explain_fa: >-
          این قاب فهرست اندامک‌های پریکاریون را یک‌جا نشان می‌دهد: هستهٔ یوکروماتین با هستک
          برجسته، شبکهٔ آندوپلاسمی خشن همراه ریبوزوم‌های آزاد (اجسام نیسل)، دستگاه گلژی،
          میتوکندری، نوروفیلامنت و در گوشهٔ فهرست، لیپوفوسین به‌عنوان رنگ‌دانهٔ پیری. این تصویر
          برای مرور سریع پیش از جلسهٔ بعد مناسب است، نه برای یادگیری اولیه؛ چون برچسب‌های ریزش
          انگلیسی‌اند و ترجمهٔ آن‌ها در جدول زیر آمده است.
        labels:
          - { fa: "یوکروماتین و هستک برجسته", en: "Euchromatic nucleus, prominent nucleolus" }
          - { fa: سیتوپلاسم, en: Cytoplasm }
          - { fa: "شبکهٔ آندوپلاسمی خشن و ریبوزوم آزاد", en: "RER + free ribosomes" }
          - { fa: اجسام نیسل, en: Nissl bodies }
          - { fa: دستگاه گلژی, en: Golgi complex }
          - { fa: میتوکندری, en: Mitochondria }
          - { fa: نوروفیلامنت, en: Neurofilaments }
          - { fa: لیپوفوسین, en: Lipofuscin }
        sources: [{ book: جزوهٔ درس, pages: "۴" }]
      - id: s01t2-p6
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۴" }, { book: "اسنل، فصل ۲", pages: "۱۰۵–۱۰۷" }]
        text: >-
          دستگاه گلژی بسیار توسعه‌یافته در کنار هسته دیده می‌شود. میتوکندری‌ها فقط در پریکاریون
          نیستند؛ در آکسون‌ها و دندریت‌ها (مخصوصاً ابتدای دندریت‌ها) هم پیدا می‌شوند، اما به تعداد
          بسیار زیاد در انتهای آکسون‌ها تجمع می‌کنند، چون آنجا محل سیناپس است و برای انتقال پیام
          عصبی به انرژی زیادی نیاز است. در پریکاریون فیلامنت‌های حد واسطی داریم که در سلول‌های
          عصبی نام اختصاصی [[term:نوروفیلامنت|Neurofilaments]] می‌گیرند؛ این‌ها را با رنگ‌آمیزی
          نقره می‌بینیم، چون نقره را به خود جذب می‌کنند. علاوه بر فیلامنت‌های حد واسط،
          میکروتوبول‌ها هم در سیتوپلاسم دیده می‌شوند.
      - id: s01t2-p7
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۴" }, { book: "اسنل، جدول ۲-۲", pages: "۱۰۰" }]
        text: >-
          رنگ‌دانه‌های پیری یا [[term:لیپوفوسین‌ها|Lipofuscin]] باقی‌ماندهٔ فعالیت‌های
          لیزوزومی‌اند: لیزوزوم‌ها موادی را گرفته و هضم کرده‌اند، اما بخش‌هایی از آن‌ها غیرقابل
          هضم بوده و همان‌جا در پریکاریون به شکل اجسام رنگی ([en:Inclusions]) باقی مانده است. چون
          نورون‌ها عمر طولانی دارند، هرچه سن نورون بالاتر می‌رود انباشت این مواد بیشتر می‌شود و
          زیر میکروسکوپ راحت‌تر دیده می‌شوند.
