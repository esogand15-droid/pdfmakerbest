  - id: s01-t01
    number: 1
    title: "تقسیم‌بندی سیستم عصبی: مرکزی و محیطی"
    mother_pages: "۵ تا ۱۰"
    status: needs_review
    why: >-
      هر مبحث بعدی روی همین تقسیم سوار است: نخاع، ساقهٔ مغز، مخچه و تلنسفال همه در ستون
      «مرکزی» می‌نشینند و اعصاب محیطی و گانگلیون‌ها در ستون «محیطی». اگر مرز این دو روشن
      نباشد، ساختارهای جلسه‌های بعد جای خودشان را در نقشه پیدا نمی‌کنند.
    objectives:
      - دو جزء اصلی دستگاه عصبی را نام ببرید و برای هرکدام یک وظیفهٔ مشخص بگویید.
      - توضیح دهید چرا مغز و نخاع در جای محافظت‌شده قرار می‌گیرند.
      - زنجیرهٔ اکتودرم ← صفحهٔ عصبی ← لولهٔ عصبی ← ستیغ عصبی را روی یک نمودار بازسازی کنید.
    prereq_required:
      - ندارد؛ نخستین مبحث جلسه است
    prereq_suggested:
      - "مرور واژه‌های [en:cranial] و [en:spinal] در آناتومی سر و گردن (گری، فصل ۸) برای جاافتادن نام اعصاب"
    key_terms:
      - { fa: دستگاه عصبی مرکزی, en: Central Nervous System }
      - { fa: دستگاه عصبی محیطی, en: Peripheral Nervous System }
      - { fa: لولهٔ عصبی, en: Neural tube }
      - { fa: ستیغ عصبی, en: Neural crest }
      - { fa: اکتودرم, en: Ectoderm }
    blocks:
      - id: s01t1-s1
        type: section
        title: "دو جزء اصلی: دستگاه عصبی مرکزی و محیطی"
      - id: s01t1-p1
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۲" }]
        text: >-
          سیستم عصبی از دو جزء اصلی تشکیل شده است: [[term:دستگاه عصبی مرکزی|Central Nervous System]]
          که به اختصار [en:CNS] گفته می‌شود، و [[term:دستگاه عصبی محیطی|Peripheral Nervous System]]
          که به اختصار [en:PNS] نامیده می‌شود. تفاوت این دو، هم در جایگاه آن‌هاست و هم در کاری که
          بر عهده دارند.
      - id: s01t1-p2
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۲" }]
        text: >-
          **دستگاه عصبی مرکزی** همان [[term:مغز|Brain]] و [[term:نخاع|Spinal Cord]] است. مغز در
          [[term:حفرهٔ جمجمه|Cranial cavity]] و نخاع در کانال مهره‌ای قرار دارد و هر دو با
          استخوان‌ها و پرده‌های اطرافشان محافظت می‌شوند. وظیفهٔ دستگاه مرکزی محلی است که پیام‌ها
          در آن دریافت و پردازش می‌شوند؛ مثلاً در رفلکس‌ها این نخاع است که پیام رفلکسی را پردازش
          و صادر می‌کند.
      - id: s01t1-p3
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۲" }]
        text: >-
          **دستگاه عصبی محیطی** شامل اعصابی است که از مرکز خارج می‌شوند؛ یا اعصاب جمجمه‌ای که از مغز
          خارج و وارد سر و گردن می‌شوند، یا اعصابی که از نخاع خارج و به اندام‌ها و ساختارهای محیطی
          می‌رسند. پیام‌هایی که جابه‌جا می‌شوند می‌توانند حسی باشند یا حرکتی.
      - id: s01t1-f1
        type: figure
        status: needs_review
        file: assets/figures/session01/p07_x52.png
        layout: auto
        title_fa: "دستگاه عصبی مرکزی و محیطی در نقشهٔ بدن"
        explain_fa: >-
          این تصویر جزوه، همان جملهٔ اول مبحث را به یک نقشه تبدیل می‌کند: مغز و نخاع در میانه و
          اعصاب محیطی که به تمام بدن می‌رسند. برای شروع کافی است دو رنگ و دو محدودهٔ متفاوت را
          ببینید؛ جزئیات نام‌گذاری اعصاب محیطی در جلسه‌های بعدی باز می‌شود.
        labels:
          - { fa: دستگاه عصبی مرکزی, en: Central Nervous System }
          - { fa: دستگاه عصبی محیطی, en: Peripheral Nervous System }
          - { fa: مغز و نخاع, en: Brain and spinal cord }
        sources: [{ book: جزوهٔ درس, pages: "۲" }]
      - id: s01t1-p4
        type: paragraph
        status: needs_review
        sources: [{ book: "اسنل، فصل ۱", pages: "۲۵" }]
        text: >-
          اسنل همان تقسیم را با یک نکتهٔ تکمیلی می‌آورد: مغز و نخاع مراکز اصلی همبستگی و
          یکپارچه‌سازی اطلاعات عصبی هستند و هر دو با دستگاه پرده‌ها (شامه‌ها) پوشیده و در مایع
          مغزی‌نخاعی معلق‌اند. به همین دلیل است که در تقسیم‌بندی، «محافظت» و «پردازش» دو روی
          یک سکه‌اند.
      - id: s01t1-f2
        type: figure
        status: needs_review
        file: assets/figures/session01/p08_x55.png
        layout: auto
        title_fa: "تقسیم اصلی دستگاه عصبی مرکزی و اجزای دستگاه محیطی"
        explain_fa: >-
          شکل ۱-۱ دو کار می‌کند: در بخش [en:A] تقسیم اصلی دستگاه عصبی مرکزی را نشان می‌دهد (مغز،
          مخچه، ساقهٔ مغز و نخاع با بخش‌های گردنی، سینه‌ای، کمری و خاجی) و در بخش [en:B] اجزای
          دستگاه محیطی را. اعصاب جمجمه‌ای در این شکل حذف شده‌اند؛ یعنی این تصویر برای «شکل کلی»
          است نه برای شمارش اعصاب. همین بخش‌بندی نخاع به چهار ناحیه، پایهٔ جلسه‌های ۳ و ۴ است.
        caption_en: "Figure 1-1 (A) Main divisions of the central nervous system. (B) Parts of the peripheral nervous system (cranial nerves have been omitted)."
        labels:
          - { fa: دستگاه عصبی مرکزی, en: Central nervous system }
          - { fa: دستگاه عصبی محیطی, en: Peripheral nervous system }
          - { fa: مغز, en: Brain }
          - { fa: مخچه, en: Cerebellum }
          - { fa: ساقهٔ مغز, en: Brainstem }
          - { fa: نخاع, en: Spinal cord }
        sources: [{ book: "اسنل، فصل ۱", figure: "۱-۱", pages: "۲۵" }]
      - id: s01t1-f3
        type: figure
        status: needs_review
        file: assets/figures/session01/p09_x58.png
        layout: auto
        title_fa: "نسبت فضایی دو دستگاه در بدن: [en:CNS] و [en:PNS]"
        explain_fa: >-
          گری همان تقسیم را با زبان تصویری خودش رسم می‌کند: دستگاه عصبی مرکزی در میانه به رنگ زرد
          و شبکهٔ دستگاه عصبی محیطی که به همهٔ بدن می‌رسد. ارزش این تصویر برای ما در «نسبت» است:
          حجم مغز و نخاع در برابر گستردگی کل شبکهٔ محیطی. توجه کنید که در این شکل هم اعصاب
          جمجمه‌ای جدا نشان داده شده‌اند و هم اعصاب نخاعی.
        caption_en: "Fig. 1.33 CNS and PNS."
        labels:
          - { fa: مغز, en: Brain }
          - { fa: عصب جمجمه‌ای, en: Cranial nerve }
          - { fa: نخاع, en: Spinal cord }
          - { fa: عصب نخاعی, en: Spinal nerve }
        sources: [{ book: گری, figure: "۱٫۳۳", pages: "۶۰" }]
      - id: s01t1-p5
        type: paragraph
        status: needs_review
        sources: [{ book: گری, pages: "۶۰" }]
        text: >-
          [en:The nervous system can be separated into parts based on structure and on function: structurally, it can be divided into the central nervous system (CNS) and the peripheral nervous system (PNS) (Fig. 1.33); functionally, it can be divided into somatic and visceral parts. The CNS is composed of the brain and spinal cord, both of which develop from the neural tube in the embryo. The PNS is composed of all nervous structures outside the CNS that connect the CNS to the body.]
      - id: s01t1-s2
        type: section
        title: "منشأ جنینی: از اکتودرم تا ستیغ عصبی"
      - id: s01t1-p6
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۲" }]
        text: >-
          دستگاه عصبی مستقیماً از لایهٔ [[term:اکتودرم|Ectoderm]] به وجود می‌آید. اکتودرم ابتدا
          [[term:صفحهٔ عصبی|Neural plate]] را می‌سازد، صفحهٔ عصبی به [[term:لولهٔ عصبی|Neural tube]]
          تبدیل می‌شود و همین لوله پایه و اساس دستگاه عصبی است. هنگام تشکیل لولهٔ عصبی، گروهی
          سلول هم در این میان شکل می‌گیرند که به آن‌ها [[term:ستیغ عصبی|Neural crest]] می‌گویند؛
          وقتی لوله کاملاً بسته می‌شود، این سلول‌ها مسیر خودشان را پیش می‌گیرند و به مقصدهای
          مختلف بدن می‌روند.
      - id: s01t1-f4
        type: figure
        status: needs_review
        file: assets/figures/session01/p10_x61.png
        layout: auto
        title_fa: "چهار گام تشکیل لولهٔ عصبی و ستیغ عصبی"
        explain_fa: >-
          چهار قاب این تصویر، همان زنجیره‌ای است که در متن آمد: صفحهٔ عصبی، فرورفتن صفحه و تشکیل
          شیار، بسته شدن لوله، و در پایان جدا شدن ستیغ عصبی از لوله. ترتیب قاب‌ها را با متن تطبیق
          بدهید؛ عدد و نام مرحله در متن جزوه آمده و اینجا فقط تصویر همان مراحل است.
        labels:
          - { fa: صفحهٔ عصبی, en: Neural plate }
          - { fa: لولهٔ عصبی, en: Neural tube }
          - { fa: ستیغ عصبی, en: Neural crest }
        sources: [{ book: جزوهٔ درس, pages: "۲" }]
      - id: s01t1-c1
        type: callout
        kind: bridge
        status: needs_review
        title: "چرا ستیغ عصبی از همین‌جا مهم می‌شود"
        text: >-
          سلول‌های گلیال دستگاه عصبی محیطی — سلول شوان و سلول اقماری — از ستیغ عصبی می‌آیند. در
          مقابل، گلیال‌های مرکزی (آستروسیت، الیگودندروسیت و اپندیم) از لولهٔ عصبی می‌آیند و
          میکروگلیا استثناست و از مونوسیت‌های خون است. این جدول کوچک منشأ، در مبحث ۶ به یک جدول
          کامل تبدیل می‌شود.
        sources: [{ book: جزوهٔ درس, pages: "۲ و ۱۶–۱۷" }]
  # ================================================================ مبحث ۲
  - id: s01-t02
    number: 2
    title: "نورون و پریکاریون: هسته، اجسام نیسل و اندامک‌ها"
    mother_pages: "۱۱ تا ۱۸"
    status: needs_review
    why: >-
      هر توضیح بعدی دربارهٔ سیناپس، میلین و انتقال آکسونی، به این برمی‌گردد که نورون یک سلول
      با یک مرکز تولید پروتئین است. اگر ندانید پروتئین کجا ساخته می‌شود، نمی‌توانید توضیح دهید
      چرا آکسون به انتقال فعال نیاز دارد.
    objectives:
      - سه جزء نورون را نام ببرید و برای هرکدام یک وظیفهٔ مشخص بگویید.
      - سه دلیل بازوفیلی جسم سلولی را توضیح دهید.
      - بگویید چرا هستهٔ پریکاریون را «فعال» می‌نامیم و کدام دو ویژگی این را نشان می‌دهد.
      - اجسام نیسل، دستگاه گلژی، نوروفیلامنت و لیپوفوسین را روی تصویر میکروسکوپی تشخیص دهید.
    prereq_required:
      - مبحث ۱ (جایگاه نورون در تقسیم‌بندی)
    prereq_suggested:
      - مرور ساختار سلول و اندامک‌ها در بافت‌شناسی پایه؛ به‌ویژه تفاوت شبکهٔ آندوپلاسمی خشن و صاف
    key_terms:
      - { fa: پریکاریون, en: Perikaryon }
      - { fa: اجسام نیسل, en: Nissl bodies }
      - { fa: مادهٔ کروماتوفیل }
      - { fa: نوروفیلامنت, en: Neurofilaments }
      - { fa: لیپوفوسین, en: Lipofuscin }
      - { fa: یوکروماتین, en: Euchromatin }
    blocks:
      - id: s01t2-s1
        type: section
        title: "دو نوع سلولِ بافت عصبی و سه جزء نورون"
      - id: s01t2-p1
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۳" }]
        text: >-
          بافت عصبی کلا از دو نوع سلول ساخته شده است: نورون‌ها که سلول‌های اصلی و انتقال‌دهندهٔ
          پیام‌اند، و نوروگلیاها (سلول‌های گلیال) که در واقع محافظان نورون‌ها هستند و دقیقاً کنار و
          اطراف آن‌ها قرار گرفته‌اند. نورون‌ها واحد عملکردی سیستم عصبی‌اند؛ یعنی کار اصلی سیستم
          عصبی را همین سلول‌ها انجام می‌دهند و هم در [en:CNS] و هم در [en:PNS] حضور دارند.
      - id: s01t2-p2
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۳" }]
        text: >-
          هر نورون سه جزء دارد: [[term:جسم سلولی|Cell body]] که به آن
          [[term:پریکاریون|Perikaryon]] هم می‌گویند؛ [[term:دندریت‌ها|Dendrites]]، زوائدی که پیام
          را به جسم سلولی می‌آورند؛ و [[term:آکسون|Axon]]، زائده‌ای که پیام را از جسم سلولی
          دور می‌کند.
      - id: s01t2-f1
        type: figure
        status: needs_review
        file: assets/figures/session01/p12_x66.png
        layout: auto
        title_fa: "اجزای یک نورون روی نمودار رنگی"
        explain_fa: >-
          این نمودار همان سه جزء متن است، اما با یک افزودهٔ مهم: برش بزرگ‌نمایی جسم سلولی که هسته،
          هستک، اجسام نیسل و دستگاه گلژی را در کنار هم نشان می‌دهد. برای شروع همین کافی است؛
          نام‌گذاری دقیق‌تر اندامک‌ها در قاب بعدی می‌آید. به تفاوت قطر دندریت در طول مسیر و ثابت
          بودن قطر آکسون هم دقت کنید (مبحث ۳ و ۴).
        labels:
          - { fa: "جسم سلولی (پریکاریون)", en: "Cell body / Perikaryon" }
          - { fa: هسته, en: Nucleus }
          - { fa: هستک, en: Nucleolus }
          - { fa: دندریت, en: Dendrite }
          - { fa: تپهٔ آکسونی, en: Axon hillock }
          - { fa: آکسون, en: Axon }
          - { fa: غلاف میلین, en: Myelin sheath }
          - { fa: دکمهٔ انتهایی, en: Axon terminal }
        sources: [{ book: جزوهٔ درس, pages: "۳" }]
      - id: s01t2-f2
        type: figure
        status: needs_review
        file: assets/figures/session01/p13_x69.png
        layout: auto
        title_fa: "نورون: دندریت، جسم سلولی و آکسون"
        explain_fa: >-
          شکل ۲-۱ اسنل ساده‌ترین نسخهٔ همین نقشه است: دندریت‌های متعدد که به جسم سلولی می‌رسند،
          هسته در مرکز، تپهٔ آکسونی و یک آکسون که از جسم سلولی خارج می‌شود. کپشن این شکل تنها یک
          واژه است، چون تصویر خودش گویاست؛ به همین دلیل توضیح ما روی «چه چیزی باید دیده شود» تمرکز
          دارد.
        caption_en: "Figure 2-1 Neuron."
        labels:
          - { fa: دندریت, en: Dendrites }
