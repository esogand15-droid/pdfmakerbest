        title_fa: "آکسون در برابر دندریت: همانندی‌ها و استثناها"
        explain_fa: >-
          این اسلاید جزوه دو نکته را کنار هم گذاشته است: نمودار نورون با تپهٔ آکسونی، گرهٔ رانویه و
          سلول شوان، و در کنارش دو میکروگراف که یکی جسم سلولی با اجسام نیسل و دیگری آکسون بدون نیسل را
          نشان می‌دهد. پیام تصویر همان جملهٔ متن است: آکسون شبیه دندریت است «به‌جز» نیسل، قطر، تعداد،
