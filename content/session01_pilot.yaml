      - id: s01t4-p7
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۹–۱۰" }, { book: اسنل, pages: "۱۰۸" }]
        text: >-
          این انتقال‌ها خودبه‌خودی انجام نمی‌شوند؛ به [[term:پروتئین‌های موتور|Motor Proteins]] نیاز
          داریم که مثل کامیون روی ریل‌های میکروتوبولی راه می‌روند. این پروتئین‌ها آنزیم [en:ATPase]
          دارند؛ یعنی با مصرف [en:ATP] انرژی می‌گیرند و حرکت می‌کنند. [[term:کینزین|Kinesin]] مسئول
          انتقال آنتروگراد است و مواد را از سوما به انتهای آکسون می‌برد؛ [[term:داینین|Dynein]] مسئول
          انتقال رتروگراد است و مواد را از انتها جمع می‌کند و به سوما می‌آورد.
      - id: s01t4-c1
