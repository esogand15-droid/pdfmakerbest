      - id: s01t6-p4
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۵" }]
        text: >-
          یکی از دلایل گستردگی زوائد انتهایی آستروسیت‌ها این است که جایگاه سیناپسی به وجود بیاورند و
          بتوانند تحریکات را دریافت و بررسی کنند. علاوه بر این، در زوائد بلند آستروسیت‌ها دسته‌جات
          فیلامنت‌های حد واسط، تحت عنوان پروتئین اسیدی رشتهٔ گلیال
          ([en:Glial fibrillary acid protein, GFAP])، وجود دارد که باعث تقویت زوائد می‌شود و به‌عنوان
          مارکر اختصاصی شناسایی آستروسیت‌ها به کار می‌رود.
      - id: s01t6-c1
        type: callout
        kind: clinical
        status: needs_review
        title: "از [en:GFAP] تا تشخیص تومور"
        text: >-
          آستروسیت‌ها شایع‌ترین منشأ تومور در مغز هستند و این تومورها آستروسیتوما نامیده می‌شوند. منطق
          تشخیص در جزوه اینگونه است: تومور یعنی سلول زیاد، سلول زیاد یعنی زوائد زیاد، زوائد بیش از
          اندازه زیاد یعنی [en:GFAP] زیاد؛ پس با مارکر اختصاصی [en:GFAP] می‌توان سلول‌ها را شناسایی
          کرد و به اطلاعاتی دست یافت که نوع سرطان از نوع آستروسیتوما است. آستروسیت‌ها علاوه بر تنظیم
          غلظت یونی، حمایت فیزیکی از نورون، تنظیم ارتباط عروق، تغذیه و ترمیم را هم بر عهده دارند.
        sources: [{ book: جزوهٔ درس, pages: "۱۵" }]
