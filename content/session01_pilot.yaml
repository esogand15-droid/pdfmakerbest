  # ================================================================ مبحث ۳
  - id: s01-t03
    number: 3
    title: "دندریت و خارهای دندریتی"
    mother_pages: "۱۹ تا ۲۱"
    status: needs_review
    why: >-
      دندریت تنها ورودی اصلی نورون است و خارهای دندریتی جای سیناپس‌های تحریکی. اگر ساختار خار
      روشن شود، بحث یادگیری و شکل‌پذیری عصبی و بخش بزرگی از فیزیولوژی سیناپس جای خودش را پیدا
      می‌کند.
    objectives:
      - معنای واژهٔ دندریت و دلیل نام‌گذاری آن را بگویید.
      - دو استثنای سیتوپلاسم دندریت نسبت به پریکاریون را نام ببرید.
      - توضیح دهید چرا خار دندریتی شکل خود را تغییر می‌دهد و این تغییر چه پیامدی دارد.
    prereq_required:
      - مبحث ۲ (پریکاریون و اندامک‌ها)
    prereq_suggested:
      - هیچ؛ اما دانستن اسم رشته‌های اکتین از بافت‌شناسی پایه کمک می‌کند
    key_terms:
      - { fa: دندریت, en: Dendrite }
      - { fa: خار دندریتی, en: Dendritic spine }
      - { fa: میکروفیلامنت, en: Microfilament }
      - { fa: اکتین, en: Actin }
      - { fa: شکل‌پذیری عصبی, en: Neuroplasticity }
    blocks:
      - id: s01t3-s1
        type: section
        title: "دندریت: زوائد درخت‌مانند نورون"
      - id: s01t3-p1
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۵" }]
        text: >-
          واژهٔ [[term:دندریت|Dendrite]] از کلمهٔ یونانی [en:Dendron] به معنای «درخت» گرفته شده
          است. دندریت‌ها زوائدی هستند که از جسم سلولی نورون خارج می‌شوند؛ معمولاً تعداد زیادی از
          این زوائد از سوما بیرون می‌آیند و بلافاصله شروع به انشعاب می‌کنند و حالتی درخت‌مانند
          می‌سازند — و دقیقاً به‌خاطر همین ظاهر منشعب و درختی است که دندریت نامیده می‌شوند.
      - id: s01t3-p2
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۵–۶" }, { book: "اسنل، فصل ۲", pages: "۱۲۰" }]
        text: >-
          یک ویژگی آناتومیک مهم دندریت‌ها این است که ضخامتشان در طول مسیر متغیر است: وقتی دندریت
          از جسم سلولی جدا می‌شود، ابتدای آن قطر بیشتری دارد و هرچه دورتر می‌شویم و شاخه‌شاخه
          می‌شود، از قطرش کم و باریک‌تر می‌شود. اسنل هم همین را می‌گوید: قطر دندریت با فاصله
          گرفتن از جسم سلولی کاهش می‌یابد و اغلب به‌شدت منشعب می‌شود.
      - id: s01t3-p3
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۶" }]
        text: >-
          سیتوپلاسم دندریت به‌شدت شبیه سیتوپلاسم جسم سلولی است، اما با دو استثنای مهم: درون آن
          **هسته وجود ندارد و دستگاه گلژی دیده نمی‌شود**. پس ابتدای دندریت (جایی که به سوما وصل
          است) از نظر اندامک بیشترین شباهت را به پریکاریون دارد و هرچه به انتهای شاخه‌های
          باریک‌تر می‌رویم، تعداد اندامک‌ها کمتر می‌شود.
      - id: s01t3-s2
        type: section
        title: "خارهای دندریتی: ایستگاه‌های دریافت پیام"
      - id: s01t3-p4
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۶" }, { book: "اسنل، فصل ۲", pages: "۱۲۰" }]
        text: >-
          روی سطح شاخه‌های باریک‌تر دندریت، برجستگی‌های کوچک و متعددی وجود دارد که به آن‌ها
          [[term:خارهای دندریتی|Dendritic Spines]] می‌گویند. این خارها فقط در انتهای شاخه‌های
          باریک نیستند و در بخش‌های دیگر زوائد دندریتی هم پیدا می‌شوند. کار اصلی دندریت‌ها دریافت
          اطلاعات از نورون‌های مجاور است و این دریافت دقیقاً از طریق همین خارها انجام می‌شود:
          آکسون نورون پیش‌سیناپسی روی این خارها می‌نشیند، سیناپس می‌دهد و اطلاعات را منتقل می‌کند.
      - id: s01t3-f1
        type: figure
        status: needs_review
        file: assets/figures/session01/p20_x88.png
        layout: auto
        title_fa: "خار دندریتی: برجستگی روی سطح دندریت"
        explain_fa: >-
          این قاب، خار دندریتی را از نزدیک نشان می‌دهد: برجستگی‌ای که ساقه‌ای باریک دارد و در نوک
          خود یک سر پهن‌تر. همین سر پهن، محل تماس با آکسون پیش‌سیناپسی است. توجه کنید که خار از
          سطح دندریت بیرون زده و جزو خود دندریت است، نه یک سلول جدا.
        labels:
          - { fa: خار دندریتی, en: Dendritic spine }
          - { fa: سر خار, en: Spine head }
          - { fa: ساقهٔ خار, en: Spine neck }
          - { fa: دندریت, en: Dendrite }
        sources: [{ book: جزوهٔ درس, pages: "۶" }]
      - id: s01t3-f2
        type: figure
        status: needs_review
        file: assets/figures/session01/p21_x91.png
        layout: auto
        title_fa: "اندازه و اجزای درون خار دندریتی"
        explain_fa: >-
          درون خار دندریتی رشته‌های اسکلت سلولی به نام میکروفیلامنت دیده می‌شود که از پروتئین
          اکتین ساخته شده‌اند. مقیاس کنار تصویر (کمتر از یک میکرومتر) نشان می‌دهد با ساختاری بسیار
          کوچک روبه‌رو هستیم؛ همین کوچکی است که تغییر شکل سریع آن را ممکن می‌کند.
        labels:
          - { fa: خار دندریتی, en: Dendritic spine }
          - { fa: میکروفیلامنت, en: Microfilament }
          - { fa: غشای پس‌سیناپسی, en: Postsynaptic membrane }
          - { fa: دندریت, en: Dendrite }
        sources: [{ book: جزوهٔ درس, pages: "۶–۷" }]
      - id: s01t3-p5
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۷" }]
        text: >-
          رشته‌های [[term:اکتین|Actin]] ساختارهایی بسیار پویا هستند؛ یعنی مدام پلیمریزه و
          دپلیمریزه می‌شوند. این پویایی به خود خارهای دندریتی منتقل می‌شود و در نتیجه اندازه و شکل
          خارها می‌تواند مدام تغییر کند. به همین دلیل زیر میکروسکوپ خارها را با شکل‌های متفاوت
          می‌بینیم: بعضی قارچی‌شکل، بعضی فنجانی‌شکل و بعضی برجستگی ساده. همین تغییر شکل‌ها اساس
          یادگیری و حافظه در فیزیولوژی عصبی است.
      - id: s01t3-c1
        type: callout
        kind: bridge
        status: needs_review
        title: "از ساختار تا عملکرد: شکل‌پذیری عصبی"
        text: >-
          خارهای دندریتی محل اصلی تشکیل سیناپس و دریافت اطلاعات برای نورون‌اند و چون می‌توانند
          شکلشان را تغییر دهند، می‌توانند اطلاعات ورودی را بررسی کنند و تصمیم بگیرند به پیام
          اجازهٔ عبور بدهند یا ندهند. همین تغییرات سیناپسی، پایه و اساس یادگیری و حافظه است. یعنی
          یک ساختار میکروسکوپی کوچک، پل میان بافت‌شناسی و فیزیولوژی رفتار می‌شود.
        sources: [{ book: جزوهٔ درس, pages: "۷" }]
