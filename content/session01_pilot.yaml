          انتقال رتروگراد است. روی خود شکل، جهت‌ها با فلش و نام پروتئین‌ها با رنگ جدا شده‌اند. تشبیه
          متن جزوه را در ذهن نگه دارید: کینزین جلو می‌برد و می‌کشد و داینین دنده‌عقب می‌آید.
