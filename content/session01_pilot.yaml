      - id: s01t6-s2
        type: section
        title: "آستروسیت: پرتعدادترین گلیال"
      - id: s01t6-p3
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۵" }, { book: اسنل, pages: "۱۳۶–۱۳۷" }]
        text: >-
          آستروسیت پرتعدادترین نوروگلیاست، به شکل ستاره دیده می‌شود و دو نوع دارد:
          [[term:پروتوپلاسمیک|Protoplasmic]] و [[term:فیبروز|Fibrous]]. تفاوت مهم دو آستروسیت:
          فیبروزها زوائد کمتر اما طویل‌تر دارند و در مادهٔ سفید دیده می‌شوند، در حالی که
          پروتوپلاسمیک‌ها را می‌توان در مادهٔ خاکستری یافت؛ فیبروزها را بین عروق خونی هم می‌بینیم.
          اسنل همین تفکیک را با جزئیات بیشتری می‌آورد: فیبروز در مادهٔ سفید با زوائد بلند، باریک و
          کم‌انشعاب و فیلامنت‌های فراوان؛ پروتوپلاسمیک در مادهٔ خاکستری با زوائد کوتاه‌تر، ضخیم‌تر و
          پرانشعاب‌تر و فیلامنت کمتر.
