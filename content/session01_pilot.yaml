      - id: s01t5-s3
        type: section
        title: "سیناپس: محل انتقال یک‌طرفهٔ پیام"
      - id: s01t5-p4
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۱" }]
        text: >-
          سیناپس محل انتقال یک‌طرفهٔ ایمپالس‌های عصبی است؛ از یک نورون یا از یک سلول به سلول دیگر.
          اینکه می‌گوییم «سلول» و نه فقط «نورون»، به این دلیل است که سلول شرکت‌کننده در سیناپس
          می‌تواند عضله هم باشد؛ مثلاً در محل اتصال عصب به عضله. سیناپس‌ها سیگنال الکتریکی سلول
          پیش‌سیناپسی را به سیگنال شیمیایی روی سلول پس‌سیناپسی تبدیل می‌کنند و دو نوع دارند:
          الکتریکی و شیمیایی.
      - id: s01t5-f5
        type: figure
        status: needs_review
        file: assets/figures/session01/p33_x122.png
        layout: auto
        title_fa: "سیناپس الکتریکی و سیناپس شیمیایی"
        explain_fa: >-
          در بخش الکتریکی، دو سلول با اتصال شکاف‌مانند ([en:gap junction]) به هم وصل شده‌اند و
          جریان مستقیم از یکی به دیگری می‌رود. در بخش شیمیایی، دکمهٔ پیش‌سیناپسی با وزیکول‌ها و
          شکاف سیناپسی و غشای پس‌سیناپسی دیده می‌شود. این دو بخش را با هم ببینید تا تفاوت «انتقال
          مستقیم الکتریکی» و «تبدیل به پیام شیمیایی» جا بیفتد.
        labels:
          - { fa: سیناپس الکتریکی, en: Electrical synapse }
          - { fa: سیناپس شیمیایی, en: Chemical synapse }
          - { fa: اتصال شکاف‌مانند, en: Gap junction }
          - { fa: وزیکول سیناپسی, en: Synaptic vesicle }
          - { fa: شکاف سیناپسی, en: Synaptic cleft }
        sources: [{ book: جزوهٔ درس, pages: "۱۲" }]
      - id: s01t5-p5
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۲" }]
        text: >-
          مکانیزم انتقال شیمیایی در جزوه این‌گونه آمده است: امواج الکتریکی وقتی به انتهای آکسون
          سلول پیش‌سیناپسی می‌رسند، کانال‌های کلسیمی را باز می‌کنند؛ کلسیم واردشده باعث جابه‌جایی
          وزیکول‌ها به سمت غشای پیش‌سیناپسی می‌شود، اگزوسیتوز رخ می‌دهد و نوروترانسمیترها وارد
          شکاف سیناپسی می‌شوند. سپس دو راه پیش می‌آید: اگر انتقال‌دهنده تحریکی باشد (مانند گلوتامات
          و استیل‌کولین) با باز کردن کانال‌های سدیمی موج دپلاریزاسیون می‌سازد و سلول پس‌سیناپسی را
          تحریک می‌کند؛ و اگر مهاری باشد (مانند گابا) با باز کردن کانال‌های آنیونی مانند کلر،
          هیپرپلاریزاسیون ایجاد می‌کند و سلول را مهار می‌کند.
