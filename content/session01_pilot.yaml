      - id: s01t4-p4
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۸" }]
        text: >-
          وقتی آکسون به انتهای مسیر می‌رسد، انشعاباتی می‌سازد که به آنها
          [[term:انشعابات انتهایی|Terminal Arborizations]] می‌گویند. در انتهای این شاخه‌ها برآمدگی‌ها و
          تورم‌هایی وجود دارد که [[term:دکمه‌های انتهایی|Terminal Boutons / Synaptic Knobs]] نام دارند
          و با ساختار بعدی — دندریت نورون بعدی، عضله یا غده — سیناپس برقرار می‌کنند. انتقال اطلاعات در
          سیناپس یک‌طرفه است: از پیش‌سیناپسی به پس‌سیناپسی.
      - id: s01t4-s2
        type: section
        title: آکسوپلاسم و مقایسهٔ آکسون و دندریت
      - id: s01t4-p5
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۸" }, { book: اسنل, pages: "۱۰۳" }]
        text: >-
          سیتوپلاسمی که درون آکسون جریان دارد (**آکسوپلاسم**) از نظر محتویات تا حد زیادی شبیه سیتوپلاسم
          دندریت است: اندامک‌های مختلف و اسکلت سلولی، مخصوصاً میکروتوبول‌ها و نوروفیلامنت‌ها، به‌وفور در
          آن دیده می‌شوند. اما تفاوت بسیار مهم این است که سیتوپلاسم آکسون فاقد اجسام نیسل است؛ پس در
          آکسون سنتز پروتئین نداریم و پروتئین‌ها باید در سوما ساخته و به آکسون فرستاده شوند.
