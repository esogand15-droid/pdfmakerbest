        file: assets/figures/session01/p43_x150.png
        layout: auto
        title_fa: سلول‌های اپندیمال پوشانندهٔ کانال مرکزی و بطن سوم
        explain_fa: >-
          بخش [en:A] همان تصویر نوری است که در آن یک لایه سلول مکعبی/استوانه‌ای کانال مرکزی نخاع را
          می‌پوشاند. بخش [en:B] جزئیات الکترونی همان سلول‌ها را در بطن سوم می‌دهد؛ همان‌جایی که متن
          جزوه از میکروویلی و اتصالات محکم صحبت می‌کند.
        caption_en: "Figure 2-35 (A) Photomicrograph of ependymal cells lining the central canal of the spinal cord. (B) Electron micrograph of ependymal cells lining the cavity of the third ventricle. (Courtesy of Dr. J. M. Kerns.)"
        labels:
          - { fa: سلول‌های اپندیمال, en: Ependymal cells }
          - { fa: کانال مرکزی نخاع, en: Central canal of spinal cord }
          - { fa: بطن سوم, en: Third ventricle }
        sources: [{ book: "اسنل، فصل ۲", figure: "۲-۳۵", pages: "۱۴۵" }]
      - id: s01t6-s4
        type: section
        title: "میکروگلیا: پلیس ضدشورش [en:CNS]"
      - id: s01t6-p8
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۶–۱۷" }]
        text: >-
          میکروگلیاها کوچک‌ترین سلول‌های گلیال‌اند، اما خفن‌ترین سیستم دفاعی مغز و نخاع را تشکیل
          می‌دهند و هم در مادهٔ خاکستری و هم در مادهٔ سفید پیدا می‌شوند. نکتهٔ مهم جنینی: بقیهٔ
          گلیال‌های مغز (آستروسیت، الیگودندروسیت و اپندیم) منشأ اکتودرمی دارند، اما میکروگلیا استثناست
          و همان ماکروفاژ سیستم عصبی است؛ منشأش از مونوسیت‌های خون و در نهایت از مغز استخوان و لایهٔ
          مزودرم جنینی است. برخلاف بقیهٔ گلیال‌ها که یکجا ثابت‌اند، میکروگلیا متحرک است و در لابه‌لای
          بافت گشت می‌زند.
      - id: s01t6-tb2
        type: table
        status: needs_review
        title: میکروگلیا در دو حالت استراحت و فعال
        row_header: true
        headers: [حالت, رفتار سلول]
        rows:
          - [استراحت, زوائد متعددی دارد و محیط را اسکن می‌کند]
          - [فعال, "با دیدن آنتی‌ژن یا بافت آسیب‌دیده پاهایش را جمع می‌کند، گرد می‌شود، سریع تقسیم می‌شود و تعدادش زیاد می‌شود"]
        sources: [{ book: جزوهٔ درس, pages: "۱۷" }]
      - id: s01t6-p9
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۷" }]
        text: >-
          سه وظیفهٔ دفاعی میکروگلیا: **بیگانه‌خواری** ([en:Phagocytosis]) عوامل بیگانه را می‌خورد؛
          **معرفی آنتی‌ژن** ([en:APC]) آنتی‌ژن را به سیستم ایمنی معرفی می‌کند؛ و ترشح **سایتوکاین‌ها**،
          مواد شیمیایی‌ای که التهاب و پاسخ ایمنی را مدیریت می‌کنند. در رنگ‌آمیزی معمولی فقط هستهٔ
          کوچک، متراکم و کشیده‌اش دیده می‌شود، نه زوائدش.
      - id: s01t6-s5
        type: section
        title: "غلاف میلین: الیگودندروسیت در [en:CNS]، سلول شوان در [en:PNS]"
      - id: s01t6-p10
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۷" }]
        text: >-
          غشای میلین ([en:Myelin sheath]) عایق‌کاری آکسون‌هاست و طبق ارجاع جزوه به فیزیولوژی گایتون،
          باعث می‌شود سرعت هدایت پیام عصبی به‌شدت بالا برود (هدایت جهشی). ساختن این غشا در [en:CNS]
          وظیفهٔ الیگودندروسیت‌ها و در [en:PNS] وظیفهٔ شوان است. نام الیگودندروسیت از ریشه‌ها می‌آید:
          [en:Oligo] به معنای کم یا کوچک، [en:Dendron] به معنای شاخه یا درخت و [en:Cyte] به معنای
          سلول؛ یعنی سلولی که شاخه‌های کمی دارد.
      - id: s01t6-f6
        type: figure
        status: needs_review
        file: assets/figures/session01/p45_x155.png
        layout: auto
        title_fa: "الیگودندروسیت‌ها: گروهی در بافت و دو سلول در بزرگنمایی"
        explain_fa: >-
          این شکل همان سلولی را نشان می‌دهد که در متن نام «عایق‌کار» گرفت. اسنل در همین صفحه اضافه
          می‌کند که میکروگراف‌های الکترونی اتصال زوائد یک الیگودندروسیت واحد به غلاف میلین چند رشتهٔ
          عصبی [en:CNS] را نشان می‌دهند، اما بین دو گرهٔ رانویهٔ مجاور فقط یک زائده به میلین می‌رسد.
        caption_en: "Figure 2-32 (A) Photomicrograph of a group of oligodendrocytes. (B) Electron micrograph of 2 oligodendrocytes. (Courtesy of Dr. J. M. Kerns.)"
        labels:
          - { fa: الیگودندروسیت, en: Oligodendrocyte }
          - { fa: هسته, en: Nucleus }
          - { fa: بافت عصبی اطراف, en: Surrounding nervous tissue }
        sources: [{ book: "اسنل، فصل ۲", figure: "۲-۳۲", pages: "۱۴۰" }]
      - id: s01t6-f7
        type: figure
        status: needs_review
        file: assets/figures/session01/p46_x158.png
        layout: side
        title_fa: پیچیدن سلول میلین‌ساز دور آکسون در برش طولی و عرضی
        explain_fa: >-
          این قاب مراحل میلین‌دار شدن یک آکسون را در چند برش عرضی نشان می‌دهد: سلول میلین‌ساز، هستهٔ
          آن و لایه‌های غشایی که دور آکسون می‌پیچند. همان تصویری است که در جزوه برای تفهیم «میلین چطور
          ساخته می‌شود» آمده و در بحث سلول شوان به آن برمی‌گردیم.
        side_text: >-
          یک سلول الیگودندروسیت می‌تواند زوائد خود را دراز کند و چندین آکسون مختلف (یا چند بخش از یک
          آکسون بلند) را همزمان بغل کند و برایشان میلین بسازد؛ یعنی نسبتش **یک به چند** است. اسنل عدد
          این را هم می‌دهد: یک الیگودندروسیت می‌تواند تا [[num:۶۰ قطعهٔ بین‌گره‌ای]]
          ([en:internodal segment]) میلین بسازد.
        labels:
          - { fa: سلول میلین‌ساز, en: Myelinating cell }
          - { fa: هسته, en: Nucleus }
          - { fa: آکسون, en: Axon }
          - { fa: غلاف میلین, en: Myelin sheath }
        sources: [{ book: جزوهٔ درس, pages: "۱۷" }, { book: اسنل, pages: "۱۴۱" }]
      - id: s01t6-p11
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۸" }, { book: اسنل, pages: "۱۴۱" }]
        text: >-
          سلول‌های شوان دقیقاً همکار الیگودندروسیت‌ها هستند، اما در [en:PNS] کار می‌کنند. نامشان به
          افتخار تئودور شوان، بافت‌شناس آلمانی، انتخاب شده و نام علمی‌ترشان که ممکن است در تست‌ها به
          کار برود **نورولموسیت** ([en:Neurolemmocytes]) است. تفاوت ساختاری بسیار مهم: برخلاف
          الیگودندروسیت که چند آکسون را همزمان عایق می‌کند، هر سلول شوان فقط و فقط می‌تواند یک قطعهٔ
          کوچک از یک آکسون را میلین‌دار کند — **نسبت یک به یک** — و کل هیکلش را دور همان یک قطعه می‌پیچد.
      - id: s01t6-f8
        type: figure
        status: needs_review
        file: assets/figures/session01/p47_x161.png
        layout: auto
        quality_flags:
          - "وضوح مؤثر بسیار پایین در جزوهٔ مادر (حدود ۶۵ DPI) — اولویت جایگزینی با نسخهٔ باکیفیت‌تر"
        title_fa: سلول اقماری و سلول شوان در یک گانگلیون محیطی
        explain_fa: >-
          این قاب دو سلول محیطی را کنار هم نشان می‌دهد: سلول‌های اقماری که مثل لایه‌ای نازک دور جسم
          سلولی نورون گانگلیون را می‌پوشانند و سلول‌های شوان که روی آکسون خارج‌شده از گانگلیون میلین
          می‌سازند. همین تصویر تفاوت «پوشش جسم سلولی» و «پوشش آکسون» را در [en:PNS] روشن می‌کند.
        labels:
          - { fa: جسم سلولی نورون گانگلیونی, en: Peripheral ganglionic neuron cell body }
          - { fa: سلول‌های اقماری, en: Satellite cells }
          - { fa: سلول‌های شوان, en: Schwann cells }
          - { fa: آکسون, en: Axon }
        sources: [{ book: جزوهٔ درس, pages: "۱۸" }]
      - id: s01t6-p12
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۷" }]
        text: >-
          سلول‌های اقماری ([en:Satellite cells]) در [en:PNS] و در گانگلیون‌ها هستند؛ گانگلیون محل
          تجمع جسم سلولی نورون‌هاست و سلول‌های اقماری دقیقاً همین‌جا حضور دارند و منشأشان ستیغ عصبی
          است — یادآوری مهم: کلاً گلیال‌های [en:PNS] (شوان و اقماری) از ستیغ عصبی می‌آیند. این سلول‌ها
          مثل لایه‌ای نازک دور تا دور جسم سلولی نورون را می‌پوشانند و دو کار ایجاد می‌کنند: محیط
          ایزوله تا نورون از نظر الکتریکی و شیمیایی جدا شود و پیام نورون‌های دیگر روی آن اثر نگذارد،
          و تغذیه و حمایت؛ دقیقاً مانند نقش آستروسیت در مغز.
      - id: s01t6-s6
        type: section
        title: "بازگشت به نقشهٔ کل بدن: [en:CNS]، [en:PNS] و نخاع"
      - id: s01t6-f9
        type: figure
        status: needs_review
        file: assets/figures/session01/p48_x164.png
        layout: auto
        title_fa: "نقشهٔ کل بدن: نمای قدامی با بزرگنمایی برش عرضی نخاع"
        explain_fa: >-
          این قاب پایانی جلسه همان نقشهٔ مبحث ۱ است، اما این بار با یک برش عرضی نخاع در کنارش. بعد از
          شناختن نورون و شش سلول گلیال، به این تصویر برگردید و بپرسید: هر یک از آن شش سلول کجای این
          نقشه می‌نشیند؟ دو نوع محیطی (شوان و اقماری) فقط بیرون از [en:CNS] هستند و انواع مرکزی فقط
          درون آن.
        caption_en: "Fig. 2.4 Nervous system. The vertebral column and associated soft tissues of the back contain the spinal cord and proximal parts of the spinal nerves (Fig. 2.4). The more distal parts of the spinal nerves pass into all other regions of the body, including certain regions of the head."
        labels:
          - { fa: مغز, en: Brain }
          - { fa: عصب جمجمه‌ای, en: Cranial nerve }
          - { fa: نخاع, en: Spinal cord }
          - { fa: عصب نخاعی, en: Spinal nerve }
        sources: [{ book: گری, figure: "۲٫۴", pages: "۸۳" }]

