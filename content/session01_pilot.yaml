        title: "انتقال آکسونی: وقتی آکسون خودش پروتئین نمی‌سازد"
      - id: s01t4-p6
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۸–۹" }]
        text: >-
          از آنجا که آکسون‌ها می‌توانند خیلی بلند باشند و خودشان دستگاه پروتئین‌سازی ندارند، باید سیستم
          حمل‌ونقل قوی در آکسون وجود داشته باشد. مواد باید در سوما ساخته و به انتهای آکسون فرستاده شوند
          و از طرف دیگر مواد زائد یا پیام‌ها باید از انتهای آکسون به سوما برگردند. این سیستم در دو جهت
          کار می‌کند: **آنتروگراد** (از سوما به دکمه‌های سیناپسی؛ برای رساندن مواد مغذی، اندامک‌ها و
          وزیکول‌های حاوی انتقال‌دهندهٔ عصبی) و **رتروگراد** (از دکمه‌های سیناپسی به سوما؛ برای برگرداندن
          مواد بازیافتی، غشاهای خالی وزیکول‌ها و فاکتورهای رشد).
