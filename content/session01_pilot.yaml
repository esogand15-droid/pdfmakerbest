      - id: s01t6-p5
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۶" }, { book: اسنل, pages: "۱۳۸" }]
        text: >-
          بخشی از پاهای آستروسیتی به سطح خارجی مغز و نخاع می‌روند و دقیقاً زیر لایهٔ نرم‌شامه
          ([en:Pia mater]) می‌چسبند؛ آنجا پاهای انتهایی‌شان پهن و متصل می‌شود و سد یا غشای یکپارچه‌ای
          به نام [[term:غشای محدودکنندهٔ گلیال|Glial Limitans]] می‌سازد که کل [en:CNS] را از داخل
          می‌پوشاند و مرز بین بافت عصبی و پرده‌های مغزی را مشخص می‌کند. اسنل همین ساختار را دوگانه
          می‌بیند: غشای محدودکنندهٔ گلیال خارجی زیر نرم‌شامه و غشای محدودکنندهٔ گلیال داخلی زیر اپندیم.
      - id: s01t6-s3
        type: section
        title: "سلول‌های اپندیمال: فرش‌کننده‌های حفره‌های [en:CNS]"
      - id: s01t6-p6
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۱۶" }]
        text: >-
          سلول‌های اپندیمال فضاهای توخالی داخل [en:CNS] — یعنی بطن‌های مغزی و کانال مرکزی نخاع — را
          مفروش می‌کنند. شکلشان معمولاً مکعبی یا استوانه‌ای است. در قطب اپیکال (سمت فضای خالی) بسیاری
          از آنها مژک دارند و زنش مژک‌ها باعث می‌شود مایع مغزی‌نخاعی راکد نماند و به جریان بیفتد؛
          بعضی‌ها (مخصوصاً در بطن سوم) میکروویلی دارند که احتمالاً موادی را از [en:CSF] جذب می‌کند.
          در قسمت رأس با اتصالات محکم به هم چفت شده‌اند.
