note: >-
  پایلوت موتور جزوه‌ساز هامزیار: در این نسخه، دو مبحث ۴ و ۶ جلسهٔ ۱ با همان محتوای
  جزوهٔ مادر — بدون هیچ حذف یا تغییر علمی — با صفحه‌آرایی نهایی ساخته شده‌اند تا طراحی
  و موتور روی محتوای واقعی سنجیده شود. برچسب «منبع» کنار هر مطلب، ارجاع آن به جزوهٔ درس،
  اسنل یا گری است. مباحث دیگر در نقشهٔ جلسه مشخص‌اند و در نسخهٔ کامل می‌آیند.

