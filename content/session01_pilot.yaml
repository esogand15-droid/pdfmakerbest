      - id: s01t4-p7
        type: paragraph
        status: needs_review
        sources: [{ book: جزوهٔ درس, pages: "۹–۱۰" }, { book: اسنل, pages: "۱۰۸" }]
        text: >-
          این انتقال‌ها خودبه‌خودی انجام نمی‌شوند؛ به [[term:پروتئین‌های موتور|Motor Proteins]] نیاز
          داریم که مثل کامیون روی ریل‌های میکروتوبولی راه می‌روند. این پروتئین‌ها آنزیم [en:ATPase]
          دارند؛ یعنی با مصرف [en:ATP] انرژی می‌گیرند و حرکت می‌کنند. [[term:کینزین|Kinesin]] مسئول
          انتقال آنتروگراد است و مواد را از سوما به انتهای آکسون می‌برد؛ [[term:داینین|Dynein]] مسئول
          انتقال رتروگراد است و مواد را از انتها جمع می‌کند و به سوما می‌آورد.
      - id: s01t4-c1
        type: callout
        kind: conflict
        status: unresolved_conflict
        title: یک اختلاف عددی که باید ثبت شود، نه اصلاح
        text: >-
          متن جزوه عدد انتقال سریع را «بیش از [[num:۴۰۰ میلی‌متر در روز]]» می‌دهد. اسنل در صفحهٔ ۱۰۸ انتقال
          سریع را «[[num:۱۰۰ تا ۴۰۰ میلی‌متر در روز]]» می‌نویسد و همان دو موتور پروتئینی (کینزین برای آنتروگراد
          و داینین برای رتروگراد) را نام می‌برد. هر دو نقل شده‌اند و کنار هم مانده‌اند تا در بازبینی
          نهایی مشخص شود کدام در متن نهایی می‌ماند.
        sources: [{ book: جزوهٔ درس, pages: "۹" }, { book: "اسنل، فصل ۲", pages: "۱۰۸" }]
      - id: s01t4-c2
        type: callout
        kind: clinical
        status: needs_review
        title: "مسیر رتروگراد، در ورود بعضی ویروس‌ها"
        text: >-
          بسیاری از ویروس‌ها مانند ویروس هاری و پولیو از همین مسیر رتروگراد استفاده می‌کنند تا خودشان
          را به جسم سلولی برسانند و سیستم عصبی را درگیر کنند. این جمله در جزوه با عنوان «نکتهٔ بالینی»
          آمده و همان است که اهمیت بالینی انتقال آکسونی را نشان می‌دهد: هر دارو یا ویروسی که بخواهد از
          محیط به جسم سلولی برسد، در عمل با داینین هم‌مسیر می‌شود.
        sources: [{ book: جزوهٔ درس, pages: "۹" }]

  # ================================================================ مبحث ۵
  - id: s01-t05
    number: 5
    title: "انواع نورون و سیناپس"
    mother_pages: "۲۸ تا ۳۷"
    status: needs_review
    why: >-
      طبقه‌بندی نورون‌ها زبان مشترک همهٔ جلسه‌های بعد است: هر جا دربارهٔ عصب حسی، نورون حرکتی
      نخاع یا نورون مخچه صحبت شود، همین چهار دسته به کار می‌آید. سیناپس هم نقطهٔ اتصال
      بافت‌شناسی به فیزیولوژی است.
    objectives:
      - سه دستهٔ نورون از نظر عملکردی و چهار دسته از نظر مورفولوژی را نام ببرید.
      - بگویید «کاذب» در نورون تک‌قطبی کاذب به چه معناست.
      - سه بخش سیناپس شیمیایی را روی تصویر نشان دهید.
      - شش نوع سیناپس بر اساس ساختارهای درگیر را فهرست کنید.
    prereq_required:
      - مبحث ۳ و ۴ (زوائد نورون)
    prereq_suggested:
      - "مرور واژه‌های [en:depolarization] و [en:hyperpolarization] از فیزیولوژی؛ در این جزوه فقط نامشان می‌آید"
    key_terms:
