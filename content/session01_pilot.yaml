          عوض در قسمت قاعده زوائدی را مستقیماً به بافت عصبی زیرین می‌فرستند و با نورون‌ها و
          آستروسیت‌های مجاور درگیر می‌شوند. اسنل همین را با جملهٔ کوتاه‌تری می‌گوید: پایهٔ سلول‌های
          اپندیمال روی غشای محدودکنندهٔ گلیال داخلی قرار دارد.
