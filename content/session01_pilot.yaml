  - id: s01t6-sb1
    type: summary_box
    status: needs_review
    title: "خلاصهٔ تمایز [en:CNS] و [en:PNS] در یک جمله"
    text: >-
      در [en:CNS]: آستروسیت (دو نوع)، الیگودندروسیت (یک به چند)، میکروگلیا (از مزودرم) و اپندیم.
      در [en:PNS]: سلول شوان (یک به یک) و سلول اقماری (پوشش جسم سلولی در گانگلیون). هر دو گلیال
      [en:PNS] از ستیغ عصبی می‌آیند و هر سه گلیال اصلی [en:CNS] از لولهٔ عصبی؛ تنها استثنا
      میکروگلیاست که از مونوسیت خون می‌آید.
    sources: [{ book: جزوهٔ درس, pages: "۱۴–۱۸" }]
