        explain_fa: >-
          این قاب، سه نوع پرتکرار جدول بالا را روی یک نورون نشان می‌دهد: آکسوسوماتیک روی جسم
          سلولی، آکسودندریتی روی دندریت و آکسوآکسونی روی آکسون. توجه کنید که هر سه، از دید ساختار
          پیش‌سیناپسی «آکسون» هستند و تفاوتشان در ساختار پس‌سیناپسی است؛ همین نکته کلید حفظ کردن
          جدول است.
        labels:
          - { fa: "آکسوسوماتیک یا آکسودندریتی", en: "Axosomatic or Axodendritic" }
          - { fa: آکسوآکسونی, en: Axoaxonic }
          - { fa: پایانهٔ آکسون, en: Axon terminals }
          - { fa: "جسم سلولی یا دندریت", en: "Cell body or dendrite" }
        sources: [{ book: جزوهٔ درس, pages: "۱۳" }]
      - id: s01t5-c1
        type: callout
        kind: key
        status: needs_review
        title: "انتقال‌دهنده‌های عصبی که در جزوه نام برده شده‌اند"
        text: >-
          در [en:CNS] سه خانواده نام برده شده است: کاتکول‌آمین‌ها مانند اپی‌نفرین، نوراپی‌نفرین و
          دوپامین؛ آمینواسیدها مانند گلوتامات، گلیسین و گاماآمینوبوتیریک‌اسید (گابا)؛ و پپتیدهای
          کوچک مانند اندورفین‌ها و مادهٔ [en:P]. این فهرست همان است که در جزوه آمده و در این جلسه
          فقط معرفی می‌شود؛ جزئیات هرکدام در جلسهٔ فیزیولوژی باز می‌شود.
        sources: [{ book: جزوهٔ درس, pages: "۱۳" }]
      - id: s01t5-c2
        type: callout
        kind: clinical
        status: needs_review
        title: "نکتهٔ بالینی: چرا شکاف سیناپسی اهمیت درمانی دارد"
        text: >-
          در اختلالات اضطرابی و افسردگی، جذب سروتونین کم است یا تحریکات کافی نیست؛ به همین دلیل
          داروهایی تجویز می‌شود که بازجذب سروتونین را مهار می‌کنند تا غشای پس‌سیناپسی بیشتر در
          معرض سروتونین قرار بگیرد. این مثال جزوه نشان می‌دهد که کم و زیاد شدن مقدار
          انتقال‌دهنده‌ها می‌تواند بر فعالیت و سلامت بدن اثر بگذارد.
        sources: [{ book: جزوهٔ درس, pages: "۱۳" }]
  # ================================================================ مبحث ۶
  - id: s01-t06
    number: 6
    title: نوروگلیاها و غلاف میلین
    mother_pages: "۳۸ تا ۴۹"
    status: needs_review
    why: >-
      شش سلول گلیال نیمی از حجم مغز را می‌سازند و هر جلسهٔ بعدی (میلین، سد خونی‌مغزی، بازسازی عصبی)
      به همین جدول تکیه می‌کند. تفاوت الیگودندروسیت و سلول شوان هم از پرتکرارترین پرسش‌های این درس است.
    objectives:
      - شش سلول گلیال را نام ببرید و محل هرکدام را بگویید.
      - منشأ جنینی هر شش سلول را در جدول بازسازی کنید.
      - تفاوت آستروسیت فیبروز و پروتوپلاسمیک را در سه ویژگی بگویید.
      - نسبت میلین‌سازی الیگودندروسیت و سلول شوان را با عدد توضیح دهید.
    prereq_required:
      - "مبحث ۲: نورون و پریکاریون"
    prereq_suggested:
