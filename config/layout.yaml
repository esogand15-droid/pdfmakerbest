# پیکربندی هوش چیدمان هامزیار — وزن‌های امتیازدهی و ترجیحات طراحی (حافظهٔ طراحی).
# این فایل «ترجیح قابل تنظیم و قابل بازگشت» است؛ هیچ قاعدهٔ علمی یا محتوایی اینجا نیست.
# محدودیت‌های سخت (سقف ارتفاع، کف خوانایی، حفظ محتوا) در کد اعمال می‌شوند و با وزن قابل دور زدن نیستند.

weights:
  content_fit: 0.30     # تناسب کهن‌الگوی بخش با نوع چیدمان
  aspect_fit: 0.20      # تناسب نسبت ابعاد تصویر با چیدمان
  readability: 0.20     # وضوح مؤثر و عرض چاپ (خوانایی برچسب‌ها)
  density: 0.10         # اقتصاد صفحه (ارتفاع پیش‌بینی‌شدهٔ بلوک)
  diversity: 0.10       # فاصله از چیدمان شکل قبلی همان مبحث
  continuity: 0.05      # چسبیدن تصویر به متن وابسته
  print_safety: 0.05    # فاصله از سقف‌های سخت اندازه

preferences:
  diversity_strength: 0.7   # ۰ یعنی تنوع اصلاً مهم نیست؛ ۱ یعنی جریمهٔ کامل تکرار
  diversity_epsilon: 0.06   # اختلاف امتیاز کمتر از این = «تقریباً برابر» برای تعویض تنوعی
  prefer_calm_text_pages: true  # بخش‌های توضیحی بلند، ریتم تنفسی (فاصلهٔ بیشتر) می‌گیرند

# قرابت کهن‌الگوی بخش ← نوع چیدمان شکل (۰ تا ۱)
affinity:
  figure_centric: { full: 0.85, sidecap: 0.80, side: 0.70 }
  comparison:     { full: 0.80, sidecap: 0.65, side: 0.55 }
  process:        { full: 0.80, sidecap: 0.70, side: 0.75 }
  explanatory:    { full: 0.60, sidecap: 0.85, side: 0.90 }
  classification: { full: 0.75, sidecap: 0.75, side: 0.70 }
  definition_led: { full: 0.70, sidecap: 0.80, side: 0.75 }
  summary:        { full: 0.75, sidecap: 0.75, side: 0.70 }
  mixed:          { full: 0.75, sidecap: 0.75, side: 0.70 }

# نقشهٔ جامع مرور (Master Revision Map): استخراج مکانیکیِ بی‌اتلاف گزاره‌ها و
# چیدمان فشردهٔ آن‌ها زیر بخش خودشان؛ فونت زیر کف خوانایی نمی‌رود و اگر محتوا
# در یک صفحه جا نشد، نقشه به‌صورت چندصفحه‌ایِ کامل ادامه پیدا می‌کند.
revision_map:
  enabled: true

# صفحهٔ اختصاصی نمودار درختی جامع جلسه (بعد از نقشهٔ مرور، قبل از جمع‌بندی)
tree_page:
  enabled: true

# برگهٔ مرور فوق‌فشردهٔ دوصفحه‌ای (Ultra-Compact Revision) — خروجی سوم مستقل.
# بودجهٔ فضا از اول دو صفحهٔ A4 است؛ فونت زیر کف نمی‌رود و فشرده‌سازی یعنی
# اولویت‌بندی شفاف A/B/C روی همان گزاره‌های ردیابی‌پذیر، نه بازنویسی علمی.
ultra_revision:
  enabled: true
  max_pages: 2
  base_font_pt: 8.8     # اندازهٔ پایهٔ متن برگه
  font_floor_pt: 7.5    # کف خوانایی چاپ؛ پایین‌تر از این هرگز
  max_text_ratio: 0.5   # سقف حجم متن برگه نسبت به کل گزاره‌های منبع (ضد بازنویسی)
  filler_max_chars: 200 # نکتهٔ تکمیلی بلندتر از این وارد برگه نمی‌شود
